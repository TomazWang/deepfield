name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Tag and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from plugin.json
        id: version
        run: |
          V=$(jq -r '.version' plugin/.claude-plugin/plugin.json)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Skip if dev version
        id: skip
        run: |
          V="${{ steps.version.outputs.version }}"
          if [ "$V" = "0.0.0-dev" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify all version files are in sync
        if: steps.skip.outputs.skip == 'false'
        run: ./scripts/check-versions.sh

      - name: Skip if tag already exists
        id: tag_check
        if: steps.skip.outputs.skip == 'false'
        run: |
          V="${{ steps.version.outputs.version }}"
          if git tag | grep -q "^v$V$"; then
            echo "Tag v$V already exists — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag release
        if: steps.skip.outputs.skip == 'false' && steps.tag_check.outputs.skip == 'false'
        run: |
          V="${{ steps.version.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$V"
          git push origin "v$V"

      - name: Move latest tag
        if: steps.skip.outputs.skip == 'false' && steps.tag_check.outputs.skip == 'false'
        run: |
          git tag -f latest
          git push origin latest --force

      - name: Install CLI dependencies
        if: steps.skip.outputs.skip == 'false' && steps.tag_check.outputs.skip == 'false'
        working-directory: cli
        run: npm ci

      - name: Build CLI
        if: steps.skip.outputs.skip == 'false' && steps.tag_check.outputs.skip == 'false'
        working-directory: cli
        run: npm run build

      - name: Publish to npm
        if: steps.skip.outputs.skip == 'false' && steps.tag_check.outputs.skip == 'false'
        working-directory: cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
